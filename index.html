it:{q:"Vuoi uscire con me?",sub:"Pensaci bene… tanto non cambia, c'è solo una risposta possibile.",yes:"SÌ",no:["NO","Sicuro/a?","Pensaci…","Non provarci","Impossibile 😜","Oggi no","Quasi…","Ma no 😂","Errore 404","Mi dispiace, no","Riprova","Mai e poi mai"],yT:"Sapevo che avresti detto di sì!",yS:"A presto, allora. Porta qualcosa di buono.",make:"Crea la tua domanda →",cT:"Crea la tua domanda",cS:"Scrivi la tua frase, genera il link e mandalo alla vittima. Il pulsante NO continuerà a scappare.",ph:"Ciao, ti va di andare a bere qualcosa insieme?",rL:"Messaggio dopo SÌ (facoltativo)",rH:"Lascia vuoto per la solita festa.",rP:"Fantastico! A presto.",cB:"Crea il mio link",copy:"Copia",copied:"Copiato! Ora invialo 😏",back:"← Indietro",again:"Fai un'altra domanda",title:"Di' di sì — la domanda trabocchetto"},
pt:{q:"Queres sair comigo?",sub:"Pensa bem… não que importe, só há uma resposta possível.",yes:"SIM",no:["NÃO","Tens a certeza?","Pensa lá…","Nem tentes","Impossível 😜","Hoje não","Quase…","Nem pensar 😂","Erro 404","Desculpa, não","Tenta outra vez","Nunca, jamais"],yT:"Sabia que ias dizer que sim!",yS:"Até já, então. Traz algo bom.",make:"Cria a tua própria pergunta →",cT:"Cria a tua própria pergunta",cS:"Escreve a tua frase, gera o link e envia-o à vítima. O botão NÃO vai continuar a fugir.",ph:"Olá, queres ir beber qualquer coisa comigo?",rL:"Mensagem depois de SIM (opcional)",rH:"Deixa em branco para a celebração habitual.",rP:"Boa! Até breve.",cB:"Criar o meu link",copy:"Copiar",copied:"Copiado! Agora envia 😏",back:"← Voltar",again:"Fazer outra pergunta",title:"Diz que sim — a pergunta armadilhada"},
tr:{q:"Benimle bir randevuya çıkar mısın?",sub:"İyi düşün… aslında fark etmez, tek bir cevap var.",yes:"EVET",no:["HAYIR","Emin misin?","Bir düşün…","Hiç deneme","İmkansız 😜","Bugün olmaz","Az kaldı…","Yok artık 😂","Hata 404","Üzgünüm, olmaz","Tekrar dene","Asla"],yT:"Evet diyeceğini biliyordum!",yS:"Görüşürüz o zaman. Güzel bir şeyler getir.",make:"Kendi sorunu yarat →",cT:"Kendi sorunu yarat",cS:"Cümleni yaz, linki oluştur ve kurbanına gönder. HAYIR düğmesi kaçmaya devam edecek.",ph:"Selam, benimle bir şeyler içmeye gelir misin?",rL:"EVET sonrası mesaj (isteğe bağlı)",rH:"Normal kutlamayı görmek için boş bırak.",rP:"Harika! Görüşürüz.",cB:"Linkimi oluştur",copy:"Kopyala",copied:"Kopyalandı! Şimdi gönder 😏",back:"← Geri",again:"Başka bir soru sor",title:"Evet de — tuzak soru"}
};
var $ = function(id){ return document.getElementById(id); };
var lang = (function(){
  try { var s = localStorage.getItem("dqs-lang"); if (s && T[s]) return s; } catch(e){}
  var n = (navigator.language || "es").slice(0,2).toLowerCase();
  return T[n] ? n : "es";
})();
var dodgeCount = 0, customQ = null, customR = null;

function t(){ return T[lang]; }
function applyLang(){
  var d = t();
  document.documentElement.lang = lang;
  document.title = d.title;
  $("q-sub").textContent = d.sub;
  $("btn-yes").textContent = d.yes;
  $("btn-no").textContent = d.no[dodgeCount % d.no.length];
  $("go-create").textContent = d.make;
  $("c-title").textContent = d.cT;
  $("c-sub").textContent = d.cS;
  $("c-input").placeholder = d.ph;
  $("c-response-label").textContent = d.rL;
  $("c-response").placeholder = d.rP;
  $("c-response").setAttribute("aria-label", d.rL + ". " + d.rH);
  $("c-btn").textContent = d.cB;
  $("c-copy").textContent = d.copy;
  $("c-hint").textContent = "";
  $("go-back").textContent = d.back;
  $("go-again").textContent = d.again;
  $("y-title").textContent = customR || d.yT;
  $("y-sub").textContent = d.yS;
  renderQuestion();
}
function renderQuestion(){ $("q-text").textContent = customQ || t().q; }

var sel = $("lang");
LANGS.forEach(function(l){ var o=document.createElement("option"); o.value=l; o.textContent=l.toUpperCase(); sel.appendChild(o); });
sel.value = lang;
sel.addEventListener("change", function(){
  lang = sel.value;
  try { localStorage.setItem("dqs-lang", lang); } catch(e){}
  applyLang();
});

/* --- views --- */
function show(id){
  ["view-question","view-create","view-yes"].forEach(function(v){ $(v).classList.toggle("hidden", v!==id); });
}
$("go-create").addEventListener("click", function(e){ e.preventDefault(); show("view-create"); $("c-input").focus(); });
$("go-back").addEventListener("click", function(e){ e.preventDefault(); show("view-question"); });
$("go-again").addEventListener("click", function(e){ e.preventDefault(); stopConfetti(); resetNo(); show("view-question"); });

/* --- custom question and optional YES response in URL hash (#p=...&r=...) --- */
function b64urlEncode(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function readHash(key){
  var m = location.hash.match(new RegExp("(?:^#|&)" + key + "=([A-Za-z0-9\\-_]+)"));
  if (!m) return null;
  try { var s = b64urlDecode(m[1]).trim(); return s ? s.slice(0,140) : null; } catch(e){ return null; }
}

/* --- create link --- */
$("c-btn").addEventListener("click", function(){
  var v = $("c-input").value.trim();
  if (!v) { $("c-input").focus(); return; }
  var response = $("c-response").value.trim();
  var url = location.origin + location.pathname + "#p=" + b64urlEncode(v) + (response ? "&r=" + b64urlEncode(response.slice(0,140)) : "");
  $("c-link").value = url;
  $("c-linkbox").classList.remove("hidden");
  $("c-hint").textContent = "";
});
$("c-copy").addEventListener("click", function(){
  var inp = $("c-link");
  function done(){ $("c-hint").textContent = t().copied; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(inp.value).then(done, function(){ inp.select(); document.execCommand("copy"); done(); });
  } else { inp.select(); document.execCommand("copy"); done(); }
});

/* --- the fleeing NO --- */
var noBtn = $("btn-no"), yesBtn = $("btn-yes"), fleeing = false, yesScale = 1;
function resetNo(){
  fleeing = false; dodgeCount = 0; yesScale = 1;
  noBtn.classList.remove("fleeing");
  noBtn.style.left = noBtn.style.top = "";
  yesBtn.style.transform = "";
  noBtn.textContent = t().no[0];
}
function dodge(){
  var r = noBtn.getBoundingClientRect();
  if (!fleeing) {
    fleeing = true;
    noBtn.classList.add("fleeing");
    noBtn.style.left = r.left + "px";
    noBtn.style.top = r.top + "px";
  }
  var pad = 12, w = r.width, h = r.height;
  var maxX = Math.max(pad, window.innerWidth - w - pad);
  var maxY = Math.max(pad, window.innerHeight - h - pad);
  var x = pad + Math.random() * (maxX - pad);
  var y = pad + Math.random() * (maxY - pad);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  dodgeCount++;
  var labels = t().no;
  noBtn.textContent = labels[dodgeCount % labels.length];
  if (yesScale < 1.6) { yesScale += 0.08; yesBtn.style.transform = "scale(" + yesScale.toFixed(2) + ")"; }
}
noBtn.addEventListener("pointerenter", function(e){ if (e.pointerType !== "touch") dodge(); });
noBtn.addEventListener("touchstart", function(e){ e.preventDefault(); dodge(); }, {passive:false});
noBtn.addEventListener("click", function(e){ e.preventDefault(); dodge(); });
document.addEventListener("touchmove", function(e){
  if (!e.touches || !e.touches.length) return;
  var r = noBtn.getBoundingClientRect();
  var cx = r.left + r.width/2, cy = r.top + r.height/2;
  for (var i=0;i<e.touches.length;i++){
    var dx = e.touches[i].clientX - cx, dy = e.touches[i].clientY - cy;
    if (dx*dx + dy*dy < 110*110) { dodge(); break; }
  }
}, {passive:true});

/* --- YES: celebration + confetti --- */
var confettiRunning = false, confettiRAF = null;
function stopConfetti(){
  confettiRunning = false;
  if (confettiRAF) cancelAnimationFrame(confettiRAF);
  var c = $("confetti"); c.getContext("2d").clearRect(0,0,c.width,c.height);
}
function runConfetti(){
  var c = $("confetti"), ctx = c.getContext("2d");
  c.width = window.innerWidth; c.height = window.innerHeight;
  var colors = ["#e0455a","#f4a259","#f7d154","#5aa9e6","#7fc8a9","#c780fa"];
  var parts = [];
  for (var i=0;i<160;i++) parts.push({
    x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.5,
    w: 6+Math.random()*6, h: 8+Math.random()*8,
    vy: 2+Math.random()*3, vx: -1.5+Math.random()*3,
    rot: Math.random()*Math.PI, vr: -0.1+Math.random()*0.2,
    color: colors[i%colors.length]
  });
  confettiRunning = true;
  (function frame(){
    if (!confettiRunning) return;
    ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > c.height + 20) { p.y = -20; p.x = Math.random()*c.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    confettiRAF = requestAnimationFrame(frame);
  })();
}
yesBtn.addEventListener("click", function(){
  show("view-yes");
  runConfetti();
});

/* --- init --- */
customQ = readHash("p");
customR = readHash("r");
window.addEventListener("hashchange", function(){ customQ = readHash("p"); customR = readHash("r"); resetNo(); applyLang(); show("view-question"); });
applyLang();
show("view-question");
})();
</script>
